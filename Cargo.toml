[package]
name = "tilepicky"
version = "0.1.0"
edition = "2024"
description = "Browse sprite sheets, search them, and pick tiles into tilemaps of your own."
repository = "https://github.com/spookysys/tilepicky"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36.1", features = ["default"] }
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp", "tga"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"
